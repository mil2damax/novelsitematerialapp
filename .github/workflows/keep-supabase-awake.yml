name: Keep Supabase awake

# Supabase free-tier projects pause after ~7 days with no activity, which
# triggers the "project paused" emails. The crew reports material takes in
# WhatsApp and the office logs them only occasionally, so the app can sit idle
# past that window. This job sends a tiny read request to the project twice a
# week (Mon + Thu) so Supabase always sees recent activity and never pauses it.
#
# Runs on GitHub's servers — no one's computer needs to be on.
# The anon key below is the public client key (already shipped in app.js); it is
# not a secret and only allows the same narrow, RLS-guarded read the app uses.

on:
  schedule:
    - cron: "17 13 * * 1,4"   # ~13:17 UTC, every Monday and Thursday (odd minute = less likely to be skipped)
  workflow_dispatch:            # lets you run it by hand from the Actions tab anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database so the project stays active
        env:
          SUPABASE_URL: "https://qticvdfcanuptafxruex.supabase.co"
          ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0aWN2ZGZjYW51cHRhZnhydWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNjgwOTMsImV4cCI6MjEwMjg0NDA5M30.RdDv1Lkf9_cg0NOeNR51ouCtm8j62kLNjXvSK95LSY4"
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/inventory_items?select=material_id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Accept-Profile: materials")
          echo "Supabase responded HTTP $code"
          head -c 300 /tmp/resp.txt || true
          echo
          # Any response from the API gateway means the project is awake. Only a
          # 5xx (or no response at all) is a real problem worth failing on.
          if [ "$code" -ge 500 ] || [ "$code" -eq 000 ]; then
            echo "::error::Project did not respond normally (HTTP $code) — it may be paused or down."
            exit 1
          fi
          echo "Project is awake."
